name: CI

on:
  pull_request:
  push:
    branches: [main]

# 같은 브랜치에 연속 push가 나면 이전 실행은 취소(무료 러너 시간 절약)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 빌드 검증
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 웹: Astro 빌드(타입·임포트·템플릿 오류를 여기서 잡는다)
      - name: 웹 빌드
        run: pnpm --filter @dansum/web build

      # 워커: 자격증명 없이 번들만 만들어 본다(--dry-run). 배포는 하지 않는다.
      - name: API 워커 번들 검증
        run: pnpm exec wrangler deploy --dry-run --outdir /tmp/bundle-api
        working-directory: apps/api

      - name: 파이프라인 워커 번들 검증
        run: pnpm exec wrangler deploy --dry-run --outdir /tmp/bundle-pipeline
        working-directory: workers/collector

  migrations:
    name: 마이그레이션 검증
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 빈 로컬 D1에 전 마이그레이션을 처음부터 적용해 SQL이 실제로 도는지 확인한다.
      # (운영 DB는 건드리지 않는다 — --local)
      - name: 빈 DB에 마이그레이션 전체 적용
        run: pnpm exec wrangler d1 migrations apply dansum-db --local --persist-to /tmp/d1-ci
        working-directory: apps/api
