name = "dansum-api"
main = "src/index.ts"
compatibility_date = "2025-06-01"

[[d1_databases]]
binding = "DB"
database_name = "dansum-db"
database_id = "39f86003-828b-4be8-b020-fa88bd846974"
# 스키마의 단일 소유자. CI(.github/workflows/deploy.yml)가 워커 배포 '전에'
# 여기서 `wrangler d1 migrations apply`를 돌려 코드가 스키마를 앞지르지 않게 한다.
migrations_dir = "../../packages/db/migrations"

[[kv_namespaces]]
binding = "CACHE"
id = "8fa545469be9408caf7826af34fdefdb"
