name = "dansum-pipeline"
main = "src/index.ts"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

[triggers]
crons = ["*/30 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "dansum-db"
database_id = "39f86003-828b-4be8-b020-fa88bd846974"

[[kv_namespaces]]
binding = "CACHE"
id = "8fa545469be9408caf7826af34fdefdb"

[vars]
OPENAI_MODEL = "gpt-4.1-mini"
# Cloudflare AI Gateway 경유(지역 403 우회). 대시보드에서 게이트웨이 'dansum' 생성 필요.
OPENAI_ENDPOINT = "https://gateway.ai.cloudflare.com/v1/af592b05882e4b6ea47e48376e3e2fa4/dansum/openai/chat/completions"
MAX_HTML_BYTES = "400000"
MAX_CONTENT_CHARS = "12000"
